[package]
name = "wave_field_rs"
version = "0.1.0"
edition = "2021"
description = "Wave Field LLM — O(n log n) physics-based language model, Rust port"

[dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
rustfft = "6"
num-complex = "0.4"
rand = "0.8"
rand_distr = "0.4"
rayon = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "wave_field_bench"
harness = false

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
